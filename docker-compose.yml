# ═══ Converge 生产部署 ═══
# 启动: docker compose up -d
# 查看: docker compose logs -f app

name: converge

services:
  # ── L0: 数据库迁移 (一次性, 阻塞 App 启动) ──
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: converge:local
    pull_policy: build
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-converge}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
    entrypoint: ["php", "/var/www/converge/scripts/run-migrations.php"]
    restart: "no"

  # ── 主应用 ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: converge:local
    pull_policy: build
    ports: ["${NGINX_PORT:-80}:80"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      clickhouse:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-converge}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      STATS_BACKEND: ${STATS_BACKEND:-auto}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-converge}
      APP_ENV: production
    volumes:
      - ./public:/var/www/converge/public
      - ./app:/var/www/converge/app
      - ./kernel:/var/www/converge/kernel
      - ./modules:/var/www/converge/modules
      - ./templates:/var/www/converge/templates
      - ./resources:/var/www/converge/resources
      - ./config:/var/www/converge/config
      - app_storage:/var/www/converge/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-converge}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/my.cnf:/etc/mysql/conf.d/clickhouse-sync.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 15s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── ClickHouse 分析引擎 (P3: 可选OLAP后端) ──
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    ports: ["${CLICKHOUSE_HTTP_PORT:-8123}:8123", "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-converge}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./database/clickhouse/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/clickhouse/setup-materialized-mysql.sql:/setup-materialized-mysql.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      retries: 3
      start_period: 10s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  mysql_data:
  redis_data:
  clickhouse_data:
  app_storage:
