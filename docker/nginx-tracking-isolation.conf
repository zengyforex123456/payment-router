# ═══ Converge 高可用 Nginx 配置 ═══
# 追踪流量与管理界面分离，多域名 · HTTPS · IPv6
#
# 用法:
#   追踪域名: track.example.com      → 仅 /km/, /track.php, /postback.php
#   管理域名: admin.example.com      → /campaigns.php, /login-v2.php
#   单域名:   converge.example.com   → 全部 (fallback)
#
# HTTPS:   证书放 /etc/nginx/ssl/ (Let's Encrypt certbot 自动续期)
# IPv6:    listen [::]:443 已启用

# ── 上游: 追踪专用 PHP-FPM pool (高并发) ──
upstream tracking_backend {
    server 127.0.0.1:9001 weight=3;  # tracking pool (更多 worker)
    server 127.0.0.1:9001;
}

# ── 上游: 管理专用 PHP-FPM pool (低并发) ──
upstream admin_backend {
    server 127.0.0.1:9000;  # default pool
}

# ── 限流 ──
limit_req_zone $binary_remote_addr zone=tracking:10m rate=5000r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=100r/s;

# ═══ Server 1: 追踪域名 (高性能, 最小功能) ═══
server {
    listen 80;
    listen [::]:80;
    server_name track.example.com;

    root /var/www/converge/public;
    access_log off;  # 追踪日志量大, 关闭访问日志
    error_log /var/log/nginx/tracking-error.log;

    # /km/ — 重定向追踪 (限流)
    location ~ ^/km/ {
        limit_req zone=tracking burst=200 nodelay;
        include fastcgi_params;
        fastcgi_pass tracking_backend;
        fastcgi_param SCRIPT_FILENAME $document_root/km.php;
    }

    # /track.php — 直接追踪
    location = /track.php {
        limit_req zone=tracking burst=100 nodelay;
        include fastcgi_params;
        fastcgi_pass tracking_backend;
        fastcgi_param SCRIPT_FILENAME $document_root/track.php;
    }

    # /postback.php — S2S 回传
    location = /postback.php {
        include fastcgi_params;
        fastcgi_pass tracking_backend;
        fastcgi_param SCRIPT_FILENAME $document_root/postback.php;
    }

    # 健康检查
    location = /health {
        include fastcgi_params;
        fastcgi_pass tracking_backend;
        fastcgi_param SCRIPT_FILENAME $document_root/health.php;
    }

    # 禁止其他访问
    location / { return 403; }
}

# ── Tracking HTTPS (443 + IPv6) ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name track.example.com;

    ssl_certificate     /etc/nginx/ssl/track.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/track.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    root /var/www/converge/public;
    access_log off;
    error_log /var/log/nginx/tracking-error.log;

    location ~ ^/km/ {
        limit_req zone=tracking burst=200 nodelay;
        include fastcgi_params;
        fastcgi_pass tracking_backend;
        fastcgi_param SCRIPT_FILENAME $document_root/km.php;
        fastcgi_param HTTPS on;
    }

    location = /track.php {
        limit_req zone=tracking burst=100 nodelay;
        include fastcgi_params;
        fastcgi_pass tracking_backend;
        fastcgi_param SCRIPT_FILENAME $document_root/track.php;
        fastcgi_param HTTPS on;
    }

    location = /postback.php {
        include fastcgi_params;
        fastcgi_pass tracking_backend;
        fastcgi_param SCRIPT_FILENAME $document_root/postback.php;
        fastcgi_param HTTPS on;
    }

    location / { return 403; }
}

# ═══ Server 2: 管理域名 (完整功能) ═══
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    root /var/www/converge/public;
    index index.php;

    # 管理后台限流
    limit_req zone=admin burst=20 nodelay;

    # PHP
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass admin_backend;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 静态资源
    location /build/ { expires 30d; add_header Cache-Control "public, immutable"; }

    location / { try_files $uri $uri/ /index.php?$query_string; }
}

# ═══ Server 3: 单域名模式 (开发/小规模) ═══
server {
    listen 80 default_server;
    server_name _;

    root /var/www/converge/public;
    index index.php;

    location ~ ^/km/ {
        limit_req zone=tracking burst=100 nodelay;
        include fastcgi_params;
        fastcgi_pass admin_backend;
        fastcgi_param SCRIPT_FILENAME $document_root/km.php;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass admin_backend;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }
}
