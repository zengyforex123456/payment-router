worker_processes auto;
events { worker_connections 1024; }

http {
    include mime.types;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # 追踪端点限流 (5000 QPS)
    limit_req_zone $binary_remote_addr zone=tracking:10m rate=5000r/s;

    server {
        listen 80;
        server_name _;
        root /var/www/converge/public;
        index index.php;

        # 追踪端点 — 限流
        location ~ ^/km/ {
            limit_req zone=tracking burst=100 nodelay;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/km.php;
        }

        # 健康检查
        location = /health {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/health.php;
        }

        # PHP
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # 静态文件
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    }
}
