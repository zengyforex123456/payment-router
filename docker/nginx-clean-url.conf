# Converge — 干净 URL (无 /p/ 前缀)
# 放到 nginx server block 中
#
# 访问: https://domain.com/landing
#        https://domain.com/signup
#        https://domain.com/dashboard
# 内部: → /p.php?slug=landing

location / {
    try_files $uri $uri/ /p.php?$query_string;
}

# 直接映射: /landing → /p.php?slug=landing
rewrite ^/(landing|signup|dashboard|affiliate|app)$ /p.php?slug=$1 last;

# 传统兼容: /page.php?slug=xxx 仍可用
location ~ \.php$ {
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}
