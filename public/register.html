<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>注册 — PaymentRouter</title>
<style>:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--primary:#3b82f6;--success:#22c55e;--danger:#ef4444;--radius:8px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:100%;max-width:440px}.card h1{font-size:24px;margin-bottom:8px;text-align:center}.card .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}.form-group input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px}.btn{width:100%;padding:12px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;border:none}.btn-primary{background:var(--primary);color:#fff;margin-top:8px}.error{background:var(--danger);color:#fff;padding:10px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:none}.success{background:var(--success);color:#fff;padding:10px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:none}.links{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}.links a{color:var(--primary);text-decoration:none}.perks{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}.perks span{color:var(--success)}</style></head><body>
<div class="card"><h1>创建账号</h1><p class="sub">14 天全功能免费试用 · 无需信用卡</p>
<div class="error" id="error"></div><div class="success" id="success"></div>
<div class="form-group"><label>邮箱</label><input type="email" id="email" required autofocus placeholder="you@example.com" autocomplete="email"></div><div class="form-group"><label>密码（至少 8 位）</label><input type="password" id="password" required minlength="8" autocomplete="new-password"></div><div class="form-group"><label>确认密码</label><input type="password" id="confirm" required minlength="8" autocomplete="new-password"></div><button type="button" class="btn btn-primary" id="btn" onclick="register()">免费开始</button>
<div class="perks"><span>✓</span> 14 天入门版全功能 <span>✓</span> 自动开通 <span>✓</span> 随时可升级</div>
<div class="links">已有账号？<a href="/login">登录</a> · <a href="/">返回首页</a></div></div>
<script>
async function register(){const btn=document.getElementById('btn'),err=document.getElementById('error'),suc=document.getElementById('success');const email=document.getElementById('email').value.trim(),pw=document.getElementById('password').value;if(!email){err.textContent='请输入邮箱';err.style.display='';return}if(pw.length<8){err.textContent='密码至少 8 位';err.style.display='';return}if(pw!==document.getElementById('confirm').value){err.textContent='两次密码不一致';err.style.display='';return}
btn.textContent='注册中...';btn.disabled=true;err.style.display='none';suc.style.display='none';
try{const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),15000);const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw}),signal:ctrl.signal});clearTimeout(t);const txt=await r.text();let d;try{d=JSON.parse(txt)}catch(e){throw new Error('服务器错误 ('+r.status+'): '+(txt||'').substring(0,80))}if(!r.ok)throw new Error(d.error||'注册失败 ('+r.status+')');suc.textContent='注册成功！正在跳转...';suc.style.display='';setTimeout(()=>{try{localStorage.setItem('pr_user',JSON.stringify(d))}catch(e){}window.location.href='/app'},800)}catch(ex){err.textContent=ex.name==='AbortError'?'请求超时，请检查网络后重试':(ex.message||'未知错误');err.style.display='';btn.textContent='免费开始';btn.disabled=false}}</script>
</body></html>
