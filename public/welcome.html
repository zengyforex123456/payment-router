<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Welcome — PaymentRouter</title>
<style>:root{--bg:#0f172a;--surface:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--primary:#3b82f6;--success:#22c55e;--radius:8px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}.card{background:var(--surface);border:1px solid var(--success);border-radius:var(--radius);padding:48px;max-width:500px}.card h1{font-size:28px;margin-bottom:12px}.card p{color:var(--muted);margin-bottom:24px}.btn{padding:12px 32px;border-radius:var(--radius);font-size:15px;font-weight:600;text-decoration:none;border:none;cursor:pointer}.btn-primary{background:var(--primary);color:#fff}</style></head><body>
