<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>登录 — PaymentRouter</title>
<style>:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--primary:#3b82f6;--danger:#ef4444;--radius:8px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:100%;max-width:400px}.card h1{font-size:24px;margin-bottom:24px;text-align:center}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}.form-group input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px}.btn{width:100%;padding:12px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;border:none}.btn-primary{background:var(--primary);color:#fff;margin-top:8px}.btn-primary:hover{background:#2563eb}.error{background:var(--danger);color:#fff;padding:10px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:none}.links{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}.links a{color:var(--primary);text-decoration:none}</style></head><body>
<div class="card"><h1>登录</h1><div class="error" id="error"></div>
<form onsubmit="login(event)"><div class="form-group"><label>邮箱</label><input type="email" id="email" required autofocus></div><div class="form-group"><label>密码</label><input type="password" id="password" required minlength="8"></div><button type="submit" class="btn btn-primary" id="btn">登录</button></form>
<div class="links">还没有账号？<a href="/register">免费注册</a> · <a href="/">返回首页</a></div></div>
<script>
async function login(e){e.preventDefault();const btn=document.getElementById('btn'),err=document.getElementById('error');btn.textContent='登录中...';btn.disabled=true;err.style.display='none';
try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'登录失败');localStorage.setItem('pr_user',JSON.stringify(d));window.location.href='/app'}catch(ex){err.textContent=ex.message;err.style.display='';btn.textContent='登录';btn.disabled=false}}</script>
</body></html>
